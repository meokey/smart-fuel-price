name: HACS CI/CD Pipeline
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: HACS Action Validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Run HACS Validator
        uses: hacs/action@22.5.0
        with:
          category: integration

  publish:
    name: Build & Auto-Release
    needs: validate
    # Only run this job if a tag starting with 'v' was pushed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Archive custom_components
        run: |
          cd custom_components/smart_fuel_price
          zip -r ../../smart_fuel_price.zip .
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          files: smart_fuel_price.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
