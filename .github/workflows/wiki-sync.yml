name: Wiki sync

# docs/ is the canonical home of user documentation. The GitHub wiki is a
# read-only mirror: every push to main that touches docs/ is copied over.
# Edit docs/ in a PR -- never edit the wiki directly.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ to the wiki
        run: |
          set -euo pipefail
          git clone --quiet \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki
          for f in docs/*.md; do
            base=$(basename "$f")
            # maintenance note for contributors, not a wiki page
            [ "$base" = "README.md" ] && continue
            cp "$f" /tmp/wiki/
          done
          # drop wiki pages whose docs/ source was deleted
          cd /tmp/wiki
          for f in *.md; do
            [ -f "$GITHUB_WORKSPACE/docs/$f" ] || git rm -q "$f"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already in sync"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -qm "Sync docs from main (${{ github.sha }})"
            git push -q origin HEAD:master
          fi
