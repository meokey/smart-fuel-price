[pytest]
testpaths = tests
markers =
    live: hits the real websites (run manually with: pytest -m live)
    ha_integration: needs pytest-homeassistant-custom-component -- parked 2026-10 due to an upstream version conflict between phacc 0.13.368's pinned pytest-asyncio==1.4.0 and homeassistant==2026.10.0b0 (every test in the session errors on an autouse configure_event_loop fixture, including plain sync tests with no async code at all -- not something fixable from this repo's pytest.ini/conftest.py)
addopts = -m "not live and not ha_integration"
